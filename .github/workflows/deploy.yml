name: Deploy EuroTrio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject write token
        env:
          GH_WRITE_TOKEN: ${{ secrets.GH_WRITE_TOKEN }}
        run: |
          mkdir -p dist
          sed "s|__GH_TOKEN__|$GH_WRITE_TOKEN|" index.html > dist/index.html
          sed "s|__GH_TOKEN__|$GH_WRITE_TOKEN|" top10.html > dist/top10.html
          cp data.json dist/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
